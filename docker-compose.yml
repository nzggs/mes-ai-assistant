# ============================================================
#  mes-ai-assistant（使用宿主机 Ollama，不再起 sidecar 容器）
#
#  启动：docker compose up -d --build
#  访问：http://<宿主机IP>:3001
#
#  ⚠ 网络模式：host（本配置的关键）
#    目标机 Ubuntu 20.04 的 docker bridge 网络不可用，实测：
#      bridge 下 DNS 解析 getaddrinfo EAI_AGAIN
#      bridge 下访问外网 IP → EHOSTUNREACH
#      bridge 下访问宿主机 172.28.1.15:11434 → 连接超时
#      host   下访问 registry → 308ms HTTP 200
#    改用 host 网络后：
#      - 构建期 npm ci 能正常联网
#      - 运行期 127.0.0.1:11434 就是宿主机 Ollama，无需防火墙放行
#      - 3001 端口直接监听在宿主机上，不需要端口映射
#    若换到 bridge 网络正常的机器，可删掉 network_mode / build.network
#    并恢复 ports 映射、把 OLLAMA_BASE 改为宿主机非回环 IP。
#
#  宿主机侧前置条件：
#    1) 已拉取本地模型：ollama pull deepseek-r1:1.5b
#    2) Ollama 服务已启动（host 模式下即使只监听 127.0.0.1 也能被容器访问）
# ============================================================

services:
  # ---------- 主应用（Express 托管前端 + API） ----------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # 构建阶段同样需要外网（npm ci），bridge 出不去 → 用 host
      network: host
      args:
        # 构建期烧入前端包，必须与运行时 ADMIN_TOKEN 一致
        VITE_ADMIN_TOKEN: ${ADMIN_TOKEN:-}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-}
    image: mes-ai-assistant:latest
    container_name: mes-ai-assistant
    restart: unless-stopped
    # 共享宿主机网络栈：3001 直接监听宿主机，Ollama 走 127.0.0.1 可达
    network_mode: host
    # 不写 env_file：docker compose 会自动加载同目录 .env（变量替换 + 注入容器）
    environment:
      # 容器默认 UTC，日志与文件时间戳会比北京时间早 8 小时，排查时易误判
      TZ: Asia/Shanghai
      PORT: 3001
      # host 模式下监听 IPv4 通配符，局域网可访问
      HOST: 0.0.0.0
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # 知识库数据落点（对应卷 mes-data）
      MES_DATA_DIR: /data
      # host 网络下 127.0.0.1 即宿主机 → 直连宿主机 Ollama
      OLLAMA_API_URL: ${OLLAMA_BASE:-http://127.0.0.1:11434}/v1/chat/completions
      # ===== APC / RTO（只读 HANA 数据源；未配置 HANA_* 时自动回退内置仿真源）=====
      # 取数 SQL 与参数目录见 server/apc.catalog.json，只读安全边界见 DEPLOY.md 3.4
      APC_ENABLED: ${APC_ENABLED:-1}
      HANA_HOST: ${HANA_HOST:-}
      HANA_PORT: ${HANA_PORT:-30015}
      HANA_USER: ${HANA_USER:-}
      HANA_PASSWORD: ${HANA_PASSWORD:-}
      HANA_DATABASE: ${HANA_DATABASE:-}
      HANA_USE_TLS: ${HANA_USE_TLS:-false}
      HANA_VALIDATE_CERT: ${HANA_VALIDATE_CERT:-true}
      HANA_MAX_ROWS: ${HANA_MAX_ROWS:-2000}
      HANA_STATEMENT_TIMEOUT_MS: ${HANA_STATEMENT_TIMEOUT_MS:-15000}
      HANA_USE_LIMIT: ${HANA_USE_LIMIT:-1}
      APC_CACHE_TTL_MS: ${APC_CACHE_TTL_MS:-5000}
      APC_RATE_LIMIT: ${APC_RATE_LIMIT:-60}
    volumes:
      - mes-data:/data

volumes:
  # 知识库文档、用户数据
  mes-data:
